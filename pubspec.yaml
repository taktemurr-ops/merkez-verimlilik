dependency_overrides:
  # Bütün uygulamalar aynı çekirdek ve motor sürümünü kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 92b51dd7d47c300d3611c448b5474fca5f793f2a
  verimlilik_motoru:
